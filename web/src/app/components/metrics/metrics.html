<div class="container animate-fade-in">
  <div class="topbar">
    <a routerLink="/" class="btn btn-icon"><span class="material-symbols-outlined">arrow_back</span></a>
    <h1 class="topbar-title" style="font-size: 1.5rem;">Análisis Mensual</h1>
    <div style="flex: 0 0 3rem;"></div>
  </div>

  <div class="glass-card mb-4" style="text-align: center;">
    <p style="color: var(--text-muted); font-size: 0.875rem;">Total Gastado (Este mes)</p>
    <h2 style="font-size: 2.5rem; margin: 0.5rem 0; color: var(--danger);">
      S/ {{ monthlyTotal | number:'1.2-2' }}
    </h2>
  </div>

  <h3 style="margin: 2rem 0 1rem; font-size: 1.25rem;">Gastos por Categoría</h3>

  <div *ngIf="categoryMetrics().length === 0" style="text-align: center; padding: 3rem 0; color: var(--text-muted);">
    <span class="material-symbols-outlined" style="font-size: 3rem; opacity: 0.5;">pie_chart</span>
    <p style="margin-top: 1rem;">No hay gastos registrados este mes.</p>
  </div>

  <div class="glass-card" *ngIf="categoryMetrics().length > 0">
    <div *ngFor="let item of categoryMetrics(); let last = last" [style.marginBottom]="last ? '0' : '1.5rem'">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 0.5rem;">
        <span style="font-weight: 600;">{{ item.name }}</span>
        <span style="font-size: 0.875rem; color: var(--text-muted);">S/ {{ item.amount | number:'1.2-2' }} ({{ item.percentage | number:'1.0-0' }}%)</span>
      </div>
      <div style="width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;">
        <div style="height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%); transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);" [style.width.%]="item.percentage"></div>
      </div>
    </div>
  </div>
</div>
