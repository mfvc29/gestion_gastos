<div class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
  <div class="glass-card animate-fade-in" style="width: 100%; text-align: center; padding: 3rem 2rem;">
    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
      <span class="material-symbols-outlined" style="font-size: 2.5rem; color: white;">account_balance_wallet</span>
    </div>
    
    <h1 style="margin-bottom: 0.5rem; font-size: 1.75rem;">Gestión de Gastos</h1>
    <p style="color: var(--text-muted); margin-bottom: 2.5rem;">Controla tu dinero en múltiples cuentas, sincronizado en la nube.</p>
    
    <button (click)="login()" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 1rem; display: flex; justify-content: center; align-items: center; gap: 0.75rem;">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width: 24px; height: 24px; background: white; border-radius: 50%; padding: 2px;">
      Continuar con Google
    </button>
  </div>
</div>
